# ONLY for disposable local-PC tests. Never use production WordPress Compose.
services:
  db:
    image: mariadb@sha256:07c0aaff7396b74cb7975cba78257178d188e30f531a5db2b617c48beef13c41
    environment:
      MYSQL_ROOT_PASSWORD: ${PC_TEST_ROOT_PASSWORD:?test-only-password-required}
      MYSQL_DATABASE: bloguito_pc_test
      MYSQL_USER: bloguito_test
      MYSQL_PASSWORD: ${PC_TEST_DB_PASSWORD:?test-only-password-required}
    volumes:
      - pc_test_db:/var/lib/mysql
    networks:
      - disconnected
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  wordpress:
    image: wordpress@sha256:8ae73d594a154e30b112e8d085afbc0895acf7651d8f53ef63aefb42e30822d5
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: bloguito_pc_test
      WORDPRESS_DB_USER: bloguito_test
      WORDPRESS_DB_PASSWORD: ${PC_TEST_DB_PASSWORD:?test-only-password-required}
    volumes:
      - pc_test_wp:/var/www/html
      - ./wp-cli.phar:/usr/local/bin/wp:ro
    networks:
      - disconnected
    # Deliberately no host ports, host Wordpress path or production volumes.

volumes:
  pc_test_db:
  pc_test_wp:

networks:
  disconnected:
    internal: true
