name: Private Google analytics collection

# Read-only Google API reporting; deliver via a forced-command-only SSH key.
# This public repository must never publish query data as commits, artifacts,
# workflow summaries, or job logs. Add a schedule only after delivery succeeds.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-analytics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_id == '1367302611' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate without a service account key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/955782650127/locations/global/workloadIdentityPools/bloguito-reports/providers/github-main
          service_account: bloguito-report-reader@bloguito-analytics.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install only reporting dependencies
        run: python -m pip install google-auth==2.58.0 requests==2.34.2

      - name: Collect and privately deliver both read-only reports
        env:
          REPORT_DIR: ${{ runner.temp }}/bloguito-private-report
          REPORT_SSH_KEY: ${{ secrets.BLOGUITO_ANALYTICS_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 -p "$REPORT_DIR"
          trap 'rm -f "$REPORT_DIR"/*.json "$REPORT_DIR"/*.md "$REPORT_DIR"/ssh-key "$REPORT_DIR"/key.pub "$REPORT_DIR"/known_hosts' EXIT
          test -n "$REPORT_SSH_KEY"
          # Windows clipboard/Notepad may turn LF into CRLF; keep private key
          # entirely in runner.temp and never echo its content to public logs.
          printf '%s\n' "$REPORT_SSH_KEY" | tr -d '\r' > "$REPORT_DIR/ssh-key"
          chmod 600 "$REPORT_DIR/ssh-key"
          ssh-keygen -y -f "$REPORT_DIR/ssh-key" > "$REPORT_DIR/key.pub" 2>/dev/null || {
            echo 'analytics_delivery_failed:invalid_ssh_secret_format' >&2
            exit 1
          }
          test "$(ssh-keygen -lf "$REPORT_DIR/key.pub" | awk '{print $2}')" = \
            'SHA256:B+6UdlxcxeGD1PSGzP3BJQ+HtwWXBXepu7hAO8geowQ' || {
            echo 'analytics_delivery_failed:unexpected_ssh_key' >&2
            exit 1
          }
          # A public host fingerprint verified via the pre-existing trusted
          # operator SSH connection. Never accept a changed host key silently.
          ssh-keyscan -T 10 -t ed25519 161.33.0.234 2>/dev/null > "$REPORT_DIR/known_hosts"
          test "$(wc -l < "$REPORT_DIR/known_hosts")" -eq 1
          ssh-keygen -lf "$REPORT_DIR/known_hosts" | grep -Fq 'SHA256:dgPOU/D+BElh/R4YW6p0K61ahx9NWe50stedT/pVQf0'
          chmod 600 "$REPORT_DIR/known_hosts"
          python agent-publisher/analytics_collector.py \
            --site-url 'https://lifeinfo24.org/' \
            --ga4-property '554325332' \
            --output-dir "$REPORT_DIR"
          test -s "$REPORT_DIR/google-analytics-"*.json
          test -s "$REPORT_DIR/google-analytics-"*.md
          ssh -T \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$REPORT_DIR/known_hosts" \
            -o ConnectTimeout=12 \
            -i "$REPORT_DIR/ssh-key" \
            ubuntu@161.33.0.234 < "$REPORT_DIR/google-analytics-"*.json
