name: Private Google analytics collection

# Read-only Google API reporting; deliver to an authenticated HTTPS receiver.
# This public repository must never publish query data as commits, artifacts,
# workflow summaries, or job logs. Daily schedule enabled after verified
# end-to-end manual delivery; report contents remain private.
on:
  workflow_dispatch:
  # UTC 02:17 = KST 11:17. GitHub may delay scheduled runs.
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: private-analytics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository_id == '1367302611' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate without a service account key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/955782650127/locations/global/workloadIdentityPools/bloguito-reports/providers/github-main
          service_account: bloguito-report-reader@bloguito-analytics.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install only reporting dependencies
        run: python -m pip install google-auth==2.58.0 requests==2.34.2

      - name: Collect and privately deliver both read-only reports
        env:
          REPORT_DIR: ${{ runner.temp }}/bloguito-private-report
          BLOGUITO_ANALYTICS_TOKEN: ${{ secrets.BLOGUITO_ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 -p "$REPORT_DIR"
          trap 'rm -f "$REPORT_DIR"/*.json "$REPORT_DIR"/*.md' EXIT
          test -n "$BLOGUITO_ANALYTICS_TOKEN" || {
            echo 'analytics_delivery_failed:missing_token' >&2
            exit 1
          }
          python agent-publisher/analytics_collector.py \
            --site-url 'https://lifeinfo24.org/' \
            --ga4-property '554325332' \
            --output-dir "$REPORT_DIR"
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          import requests

          reports = list(Path(os.environ['REPORT_DIR']).glob('google-analytics-*.json'))
          if len(reports) != 1:
              sys.exit('analytics_delivery_failed:report_count')
          try:
              response = requests.post(
                  'https://lifeinfo24.org/_bloguito/analytics-ingest',
                  data=reports[0].read_bytes(),
                  headers={'Authorization': 'Bearer ' + os.environ['BLOGUITO_ANALYTICS_TOKEN'],
                           'Content-Type': 'application/json'},
                  timeout=(10, 30), allow_redirects=False,
              )
          except requests.RequestException:
              sys.exit('analytics_delivery_failed:https_transport')
          if response.status_code != 200 or not response.text.startswith('analytics_ingest_ok end='):
              sys.exit('analytics_delivery_failed:http_' + str(response.status_code))
          print('analytics_delivery_ok')
          PY
