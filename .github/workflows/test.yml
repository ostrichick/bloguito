name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "agent-publisher/requirements.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum php-cli

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-publisher/requirements.txt

      - name: Run test suite
        env:
          PYTHONPATH: agent-publisher
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s agent-publisher/tests

      - name: Check WordPress admin post ID column
        run: |
          php -l wordpress/mu-plugins/bloguito-post-id-column.php
          php -l wordpress/tests/post-id-column-test.php
          php wordpress/tests/post-id-column-test.php

      - name: Check legacy table-of-contents renderer
        run: |
          php -l wordpress/mu-plugins/bloguito-legacy-toc.php
          php -l wordpress/tests/legacy-toc-contract-test.php
          php wordpress/tests/legacy-toc-contract-test.php

      - name: Syntax-check legacy layout plugins
        run: |
          php -l wordpress/mu-plugins/bloguito-legacy-callout-spacing.php
          php -l wordpress/mu-plugins/bloguito-legacy-table-accessibility.php
          # This fixture-based harness is run locally against preserved public
          # HTML, which is intentionally excluded from the public repository.
          php -l wordpress/tests/legacy-table85-accessibility-test.php

      - name: Check current reader and header polish plugins
        run: |
          php -l wordpress/mu-plugins/bloguito-reader-flow.php
          php -l wordpress/tests/reader-flow-test.php
          php wordpress/tests/reader-flow-test.php
          php -l wordpress/mu-plugins/bloguito-front-end-polish.php
          php -l wordpress/tests/front-end-polish-test.php
          php wordpress/tests/front-end-polish-test.php

  infrastructure-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check shell syntax and Compose configuration
        run: |
          bash -n agent-publisher/backup_daily.sh agent-publisher/restore_backup.sh
          MYSQL_PASSWORD=ci-placeholder MYSQL_ROOT_PASSWORD=ci-placeholder \
            docker compose -f wordpress/docker-compose.yml config --quiet
