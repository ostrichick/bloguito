name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "agent-publisher/requirements.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-publisher/requirements.txt

      - name: Run test suite
        env:
          PYTHONPATH: agent-publisher
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s agent-publisher/tests
