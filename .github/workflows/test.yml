name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "agent-publisher/requirements.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum php-cli

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent-publisher/requirements.txt

      - name: Run test suite
        env:
          PYTHONPATH: agent-publisher
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s agent-publisher/tests

      - name: Check WordPress admin post ID column
        run: |
          php -l wordpress/mu-plugins/bloguito-post-id-column.php
          php -l wordpress/tests/post-id-column-test.php
          php wordpress/tests/post-id-column-test.php

  bridge-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "agent-publisher/whatsapp-bridge/package-lock.json"
      - name: Install locked bridge dependencies
        working-directory: agent-publisher/whatsapp-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check bridge syntax and authorization tests
        working-directory: agent-publisher/whatsapp-bridge
        run: |
          node --check index.js
          node --check command_policy.js
          npm test

  infrastructure-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check shell syntax and Compose configuration
        run: |
          bash -n agent-publisher/backup_daily.sh agent-publisher/restore_backup.sh
          MYSQL_PASSWORD=ci-placeholder MYSQL_ROOT_PASSWORD=ci-placeholder \
            docker compose -f wordpress/docker-compose.yml config --quiet
