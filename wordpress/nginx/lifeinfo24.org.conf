server {
    listen 80;
    listen [::]:80;
    server_name lifeinfo24.org www.lifeinfo24.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lifeinfo24.org www.lifeinfo24.org;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/lifeinfo24.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifeinfo24.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Avoid disclosing implementation details from the PHP/Apache upstream.
    proxy_hide_header X-Powered-By;

    # Bloguito does not expose author archives. This also prevents the common
    # ?author=1 enumeration path from revealing the administrator login slug.
    if ($arg_author ~ "^[0-9]+$") {
        return 404;
    }

    location ^~ /author/ {
        return 404;
    }

    location = /readme.html {
        return 404;
    }

    location = /license.txt {
        return 404;
    }

    # Never pass executable PHP-like files from the media directory to the
    # WordPress/Apache container, even if an upload validation bug appears.
    location ~* ^/wp-content/uploads/.*\.(?:php[0-9]?|phtml|phar)$ {
        return 404;
    }

    # Block dotfiles while preserving ACME challenges if they are ever served
    # from this virtual host.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the only public reverse proxy. Overwrite rather than append
        # this header so an internet client cannot spoof the address consumed
        # by WordPress login-rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
