# Include inside the lifeinfo24.org HTTPS server block.
location = /_bloguito/analytics-ingest {
    limit_req zone=bloguito_analytics burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 4m;
    client_body_timeout 15s;
    access_log off;
    proxy_pass http://127.0.0.1:8766;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}
